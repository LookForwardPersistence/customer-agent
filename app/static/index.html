<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Defence in depth: even if a rendering bug reintroduces injected markup,
     no external script / event handler can execute. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Aurora Tech Store · 智能客服</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --border: #e4e8ee;
    --text: #1f2937; --muted: #6b7280;
    --brand: #4f46e5; --brand-soft: #eef2ff;
    --green: #059669; --green-soft: #ecfdf5;
    --amber: #b45309; --amber-soft: #fffbeb;
    --red: #dc2626; --red-soft: #fef2f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
  }
  /* ---- layout ---- */
  .chat-wrap { flex: 1; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; background: var(--brand);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  .trace-btn {
    margin-left: auto; border: 1px solid var(--border); background: var(--panel);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .trace-btn.active { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  /* ---- bubbles ---- */
  .row { display: flex; gap: 10px; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .avatar.bot { background: var(--brand-soft); color: var(--brand); }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .row.user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .row.bot .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .src-chip {
    background: var(--green-soft); color: var(--green); border: 1px solid #bbf7d0;
    border-radius: 20px; padding: 1px 8px; font-size: 10px; cursor: default;
  }
  /* ---- pending action card ---- */
  .action-card {
    background: var(--amber-soft); border: 1px solid #fde68a; border-radius: 12px;
    padding: 12px 14px; margin-top: 8px; font-size: 13px; max-width: 78%;
  }
  .action-card h4 { font-size: 13px; color: var(--amber); margin-bottom: 8px; }
  .action-card .detail { color: var(--text); line-height: 1.7; }
  .action-card .btns { display: flex; gap: 10px; margin-top: 10px; }
  .btn {
    border: none; border-radius: 8px; padding: 7px 18px; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.ghost { background: var(--panel); border: 1px solid var(--border); color: var(--muted); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  /* ---- handoff banner ---- */
  .handoff {
    background: var(--red-soft); border: 1px solid #fecaca; border-radius: 12px;
    padding: 12px 14px; font-size: 13px; color: var(--red);
  }
  .handoff b { display: block; margin-bottom: 4px; }
  .handoff .ctx { color: var(--text); background: #fff; border-radius: 8px; padding: 8px; margin-top: 8px; font-size: 12px; white-space: pre-wrap; }
  /* ---- welcome / quick chips ---- */
  .welcome {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; font-size: 13px; color: var(--muted); line-height: 1.8;
  }
  .welcome b { color: var(--text); }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 8px; }
  .quick button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .quick button:hover { border-color: var(--brand); color: var(--brand); }
  /* ---- input ---- */
  .input-bar {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 12px 20px; display: flex; gap: 10px;
  }
  .input-bar input {
    flex: 1; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; outline: none;
  }
  .input-bar input:focus { border-color: var(--brand); }
  .send {
    background: var(--brand); color: #fff; border: none; border-radius: 10px;
    padding: 0 20px; font-size: 14px; cursor: pointer;
  }
  .send:disabled { opacity: .5; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% {opacity:.25} 40% {opacity:1} }
  /* ---- trace panel ---- */
  .trace-panel {
    width: 320px; background: var(--panel); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 16px; display: none; flex-direction: column; gap: 10px;
  }
  .trace-panel.open { display: flex; }
  .trace-panel h3 { font-size: 13px; color: var(--muted); font-weight: 600; }
  .trace-item {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 11px;
    font-family: ui-monospace, Menlo, monospace; line-height: 1.5; word-break: break-all;
  }
  .trace-item .t { font-weight: 700; color: var(--brand); }
  .trace-item.result .t { color: var(--green); }
</style>
</head>
<body>
  <div class="chat-wrap">
    <header>
      <div class="logo">极</div>
      <div>
        <h1>Aurora Tech Store</h1>
        <div class="sub">智能客服 · 小极 | 在线 9:00–21:00</div>
      </div>
      <button class="trace-btn" id="traceToggle">执行轨迹 Trace</button>
      <select id="customerSel" title="切换演示客户（将创建新会话）">
        <option value="CUST-001">陈先生（演示主账号）</option>
        <option value="CUST-002">李女士</option>
        <option value="CUST-003">赵先生</option>
        <option value="CUST-004">王先生</option>
      </select>
    </header>
    <div id="messages">
      <div class="welcome">
        <b>您好，我是小极 👋</b><br>
        我是 Aurora Tech Store 的客服专员，可以帮您：
        查询<b>订单与物流</b>、解答<b>退换货/保修/运费</b>等政策、以及<b>申请退货</b>。<br>
        <span id="welcomeCustomer"></span>
      </div>
    </div>
    <div class="quick" id="quick">
      <button>退货运费谁出？</button>
      <button>查一下 AT-10086 到哪了</button>
      <button>AT-10092 的耳机不想要了，想退货</button>
      <button>你们能帮我写个 Python 脚本吗</button>
    </div>
    <div class="input-bar">
      <input id="input" placeholder="输入您的问题…" autocomplete="off">
      <button class="send" id="send">发送</button>
    </div>
  </div>

  <div class="trace-panel" id="tracePanel">
    <h3>执行轨迹（最近一轮）</h3>
    <label style="font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:8px;">
      <input type="checkbox" id="rawTraceToggle"> 显示未脱敏原始内容（仅本地排查用）
    </label>
    <div id="traceList" style="color:var(--muted);font-size:12px;">暂无。发送一条消息后，这里会展示检索来源、工具调用与结果（不含隐藏推理）。</div>
  </div>

<script src="/static/app.js"></script>
</body>
</html>
