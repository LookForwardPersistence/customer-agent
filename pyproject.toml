[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-customer-agent"
version = "0.1.0"
description = "Aurora Tech Store AI customer support agent"
# 开发/运行锁定 3.12（见 .python-version 与 CI 矩阵）。保留 <3.14 上界是因为
# langchain/langgraph 的次版本升级常有 breaking change，不做无上界声明。
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.3,<2.0",
    "langchain-openai>=1.6,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint>=4.2,<5.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.setuptools.package-data]
app = ["data/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
pythonpath = ["."]
